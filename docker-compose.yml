services:
  api:
    build: .
    entrypoint: ["tradingagents-api"]
    env_file:
      - .env
    environment:
      TRADINGAGENTS_API_HOST: 0.0.0.0
      TRADINGAGENTS_API_DB_PATH: /home/appuser/.tradingagents/api_jobs.sqlite3
    ports:
      - "127.0.0.1:${TRADINGAGENTS_API_PORT:-8000}:8000"
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents
    restart: unless-stopped

  tradingagents:
    build: .
    env_file:
      - .env
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents
    tty: true
    stdin_open: true

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama

  tradingagents-ollama:
    build: .
    env_file:
      - .env
    environment:
      - TRADINGAGENTS_LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434/v1
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents
    depends_on:
      - ollama
    tty: true
    stdin_open: true
    profiles:
      - ollama

volumes:
  tradingagents_data:
  ollama_data:
